[project]
name = "study-rag-backend"
version = "0.1.0"
description = "Backend for the study RAG app: ingestion, hybrid search, study tools and the Strands agent."
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.25.4",
    "boto3>=1.43.126",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "strands-agents[openai]>=1.64.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
