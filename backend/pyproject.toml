[project]
name = "study-rag-backend"
version = "0.1.0"
description = "Backend for the study RAG app: ingestion, hybrid search, study tools and the Strands agent."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.126",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "strands-agents>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
